DISTRO = "axiom"
DISTRO_NAME = "Axiom"
DISTRO_VERSION = "1.0.0"
DISTROOVERRIDES:append = ":axiom"
INIT_MANAGER = "systemd"
DISTRO_FEATURES:remove = "x11 wayland"
DISTRO_FEATURES:append = " opengl"
ROS_DISTRO = "jazzy"

# Orin Nano microSD: two 8 GiB rootfs slots and shared persistent/data space.
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT:jetson-orin-nano-devkit = "1"
PARTITION_LAYOUT_TEMPLATE_REDUNDANT:jetson-orin-nano-devkit = "flash_t234_axiom_qspi_sd_rootfs_ab.xml"
ROOTFSPART_SIZE_DEFAULT:jetson-orin-nano-devkit = "17179869184"

# ROS uses Bullet for geometry; its optional rendering does not need a display.
DISTRO_FEATURES:remove:pn-bullet = "opengl"
